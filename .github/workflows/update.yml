name: Update formula

# Polls the latest release of NomaDamas/filee-cli and rewrites Formula/filee-cli.rb from its SHA256SUMS. No token
# beyond the job's own GITHUB_TOKEN is used: the release repository is public, and this repository only writes itself.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Rewrite the formula from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo NomaDamas/filee-cli --json tagName --jq .tagName)
          version=${tag#v}
          gh release download "$tag" --repo NomaDamas/filee-cli --pattern SHA256SUMS --dir "$RUNNER_TEMP" --clobber
          sum() { awk -v f="filee-cli-$version-$1" '$2==f {print $1}' "$RUNNER_TEMP/SHA256SUMS"; }
          for rid in osx-arm64 osx-x64 linux-arm64 linux-x64; do
            [ -n "$(sum $rid.tar.gz)" ] || { echo "::error::no $rid asset in $tag"; exit 1; }
          done
          python3 - "$tag" "$version" "$(sum osx-arm64.tar.gz)" "$(sum osx-x64.tar.gz)" "$(sum linux-arm64.tar.gz)" "$(sum linux-x64.tar.gz)" <<'PY'
          import re, sys
          tag, version, *sums = sys.argv[1:]
          path = "Formula/filee-cli.rb"
          text = open(path).read()
          text = re.sub(r'version "[^"]+"', f'version "{version}"', text, count=1)
          rids = ["osx-arm64", "osx-x64", "linux-arm64", "linux-x64"]
          for rid, sha in zip(rids, sums):
              pattern = rf'(url "https://github.com/NomaDamas/filee-cli/releases/download/)[^"]+(/filee-cli-)[^"]+(-{rid}\.tar\.gz"\n\s+sha256 ")[0-9a-f]{{64}}(")'
              text, n = re.subn(pattern, rf'\g<1>{tag}\g<2>{version}\g<3>{sha}\g<4>', text)
              assert n == 1, f"{rid}: expected one match, got {n}"
          open(path, "w").write(text)
          PY
          git diff --stat

      - name: Commit when changed
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "formula already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "filee-cli $(sed -n 's/^  version "\(.*\)"/\1/p' Formula/filee-cli.rb)"
          git push

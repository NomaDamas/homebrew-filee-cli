name: Test formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Homebrew on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v brew >/dev/null; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
      - name: Tap this checkout
        run: brew tap nomadamas/filee-cli "$GITHUB_WORKSPACE"
      - name: Audit
        run: |
          brew style nomadamas/filee-cli/filee-cli
          brew audit --strict --online nomadamas/filee-cli/filee-cli
      - name: Install and test
        run: |
          brew install --verbose nomadamas/filee-cli/filee-cli
          brew test nomadamas/filee-cli/filee-cli
          filee-cli formats | head -3
